name: Manual E2E

on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Full commit SHA from souzaadriano28-sudo/gestao-acoes-spring
        required: true
        type: string
      frontend_sha:
        description: Full commit SHA from souzaadriano28-sudo/gestao-acoes-ui
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-e2e-${{ inputs.backend_sha }}-${{ inputs.frontend_sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Validate immutable revisions
        shell: pwsh
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
        run: |
          $shaPattern = '^[0-9a-fA-F]{40}$'
          if ($env:BACKEND_SHA -notmatch $shaPattern) {
            throw 'backend_sha must be a full 40-character hexadecimal commit SHA.'
          }
          if ($env:FRONTEND_SHA -notmatch $shaPattern) {
            throw 'frontend_sha must be a full 40-character hexadecimal commit SHA.'
          }

      - name: Check out frontend revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: souzaadriano28-sudo/gestao-acoes-ui
          ref: ${{ inputs.frontend_sha }}
          path: gestao-acoes-ui
          token: ${{ github.token }}
          persist-credentials: false

      - name: Check out backend revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: souzaadriano28-sudo/gestao-acoes-spring
          ref: ${{ inputs.backend_sha }}
          path: gestao-acoes-spring
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify isolated E2E configuration
        shell: pwsh
        run: |
          & 'gestao-acoes-ui/.github/scripts/validate-isolated-e2e.ps1' `
            -PlaywrightConfigPath 'gestao-acoes-ui/playwright.config.ts' `
            -TestProfilePath 'gestao-acoes-spring/src/main/resources/application-test.properties'

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: gestao-acoes-spring/pom.xml

      - name: Set up Node.js 24.16.0 and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: gestao-acoes-ui/package-lock.json

      - name: Pin npm 11.13.0
        working-directory: gestao-acoes-ui
        run: npm.cmd install --global npm@11.13.0 --ignore-scripts

      - name: Verify Node.js and npm versions
        working-directory: gestao-acoes-ui
        shell: pwsh
        run: |
          if ((node --version) -ne 'v24.16.0') { throw 'Unexpected Node.js version.' }
          if ((npm.cmd --version) -ne '11.13.0') { throw 'Unexpected npm version.' }

      - name: Install locked frontend dependencies
        working-directory: gestao-acoes-ui
        run: npm.cmd ci

      - name: Install lockfile-compatible Chromium
        working-directory: gestao-acoes-ui
        run: npx.cmd --no-install playwright install chromium

      - name: Run end-to-end journey
        working-directory: gestao-acoes-ui
        run: npm.cmd run e2e

      - name: Upload E2E failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-reports-${{ github.run_id }}
          path: |
            gestao-acoes-ui/playwright-report/
            gestao-acoes-ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize E2E revisions
        if: always()
        shell: pwsh
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Manual E2E'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Frontend: ``$env:FRONTEND_SHA``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Backend: ``$env:BACKEND_SHA``"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Command: `npm.cmd run e2e`'
